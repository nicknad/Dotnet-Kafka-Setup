name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore KafkaPipeline.slnx

      - name: Build
        run: dotnet build KafkaPipeline.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test KafkaPipeline.slnx --no-build --configuration Release

      - name: Audit transitive dependencies for vulnerabilities
        run: dotnet package list --project KafkaPipeline.slnx --vulnerable --include-transitive --no-restore

      - name: Restore tools
        run: dotnet tool restore

      - name: Enforce dependency policy and generate SBOM
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          dotnet tool run packageguard -- KafkaPipeline.slnx --skip-restore --github-api-key "$GITHUB_TOKEN" --sbom cyclonedx --sbom-output artifacts/sbom.cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: artifacts/sbom.cyclonedx.json
