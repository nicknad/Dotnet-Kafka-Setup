name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore KafkaPipeline.slnx

      - name: Build
        run: dotnet build KafkaPipeline.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test KafkaPipeline.slnx --no-build --configuration Release
